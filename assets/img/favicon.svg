<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-label="Özay Özaydın">
  <!-- Same geometry as logo.svg, centred in a square for tab icons. -->
  <defs>
    <mask id="fv-holes">
      <rect width="300" height="300" fill="#fff"/>
      <circle cx="100" cy="150" r="60" fill="#000"/>
      <circle cx="200" cy="150" r="60" fill="#000"/>
    </mask>
    <clipPath id="fv-left">
      <circle cx="100" cy="150" r="100"/>
    </clipPath>
  </defs>
  <g mask="url(#fv-holes)">
    <circle cx="100" cy="150" r="100" fill="#F7941E"/>
    <circle cx="200" cy="150" r="100" fill="#1C75BC"/>
    <g clip-path="url(#fv-left)">
      <circle cx="200" cy="150" r="100" fill="#5FB8FF"/>
    </g>
  </g>
</svg>
